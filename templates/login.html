{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-container">
  <div class="auth-image"><div><p class="eyebrow">WELCOME BACK</p></div>
    <div><h1>Rent the right car.</h1><p>Log in to browse the fleet and book your ride.</p></div></div>
  <form class="auth-form" method="post" action="{{ url_for('login') }}">
    <h2>Log in</h2><p>Enter your credentials to continue.</p>
    <div class="form-group"><label>Username</label><input name="username" required></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
    <button class="btn btn-primary btn-large btn-full" type="submit">Log in</button>
    <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</div></section>
{% endblock %}
