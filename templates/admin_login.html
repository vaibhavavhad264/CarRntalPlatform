{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-container">
    <div class="auth-image">
      <div>
        <p class="eyebrow">ADMIN AREA</p>
      </div>
      <div>
        <h1>Manage RentCar.</h1>
        <p>Users, cars, bookings and revenue in one place.</p>
      </div>
    </div>
    <form class="auth-form" method="post" action="{{ url_for('admin_login') }}">
      <h2>Admin login</h2>
      <p>Authorised staff only.</p>
      <div class="form-group"><label>Admin username</label><input name="username" required></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
      <button class="btn btn-primary btn-large btn-full" type="submit">Log in</button>
      <p class="auth-switch" style="margin-top:14px; text-align:center; font-size:13px; color:var(--muted);">Looking for customer portal? <a href="{{ url_for('login') }}" style="color:var(--primary); font-weight:600;">User login</a></p>
    </form>
  </div>
</section>
{% endblock %}
