{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-container">
  <div class="auth-image"><div><p class="eyebrow">JOIN RENTCAR</p></div>
    <div><h1>Your journey starts here.</h1><p>Create an account and book your first car in minutes.</p></div></div>
  <form class="auth-form" method="post" action="{{ url_for('register') }}" id="registerForm" novalidate>
    <h2>Create your account</h2><p>Fill in your details to get started.</p>
    <div class="form-group"><label>Username</label><input name="username" value="{{ form.get('username','') }}" required></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ form.get('email','') }}" required></div>
    <div class="form-grid">
      <div class="form-group"><label>Password</label><input type="password" name="password" minlength="6" required></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" name="confirm" required></div>
      <div class="form-group"><label>Age</label><input type="number" name="age" min="18" value="{{ form.get('age','') }}" required></div>
      <div class="form-group"><label>Valid driving license?</label><select name="license" required>
        <option value="">Select…</option><option value="yes" {{ 'selected' if form.get('license')=='yes' }}>Yes</option>
        <option value="no" {{ 'selected' if form.get('license')=='no' }}>No</option></select></div>
    </div>
    <p class="errs" id="errs"></p>
    <button class="btn btn-primary btn-large btn-full" type="submit">Register</button>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </form>
</div></section>
{% endblock %}
